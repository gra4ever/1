name: Build Filarmonica APK

on:
  push:
    branches: [filarmonica-apk]
    paths:
      - 'filarmonica/**'
      - '.github/workflows/filarmonica-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Materialize current corrected UI source
        working-directory: filarmonica
        run: gradle :app:compileDebugJavaWithJavac --stacktrace
      - name: Apply v0.17 base UI fixes
        working-directory: filarmonica
        run: python3 prepare_v017.py
      - name: Apply v0.18 readability fixes
        working-directory: filarmonica
        run: python3 prepare_v018.py
      - name: Apply v0.19 concert-row fix
        working-directory: filarmonica
        run: python3 prepare_v019.py
      - name: Apply v0.20 comma concert-row fix
        working-directory: filarmonica
        run: python3 prepare_v020.py
      - name: Apply v0.21 second-time concert split and icon manifest
        working-directory: filarmonica
        run: python3 prepare_v021.py
      - name: Materialize v0.21 launcher icon
        working-directory: filarmonica
        run: |
          mkdir -p app/src/main/res/drawable-nodpi
          base64 -d ic_launcher_v21.jpg.b64 > app/src/main/res/drawable-nodpi/ic_launcher_v21.jpg
          file app/src/main/res/drawable-nodpi/ic_launcher_v21.jpg
          test -s app/src/main/res/drawable-nodpi/ic_launcher_v21.jpg
      - name: Build debug APK
        working-directory: filarmonica
        run: gradle :app:clean :app:assembleDebug --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Stagiune-Filarmonica-Transilvania-v0.21-debug
          path: filarmonica/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
