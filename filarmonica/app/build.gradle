plugins {
    id 'com.android.application'
}

android {
    namespace 'ro.filarmonica.transilvania.stagiune'
    compileSdk 35

    defaultConfig {
        applicationId 'ro.filarmonica.transilvania.stagiune'
        minSdk 24
        targetSdk 35
        versionCode 6
        versionName '0.6.0'
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Keep the source readable while fixing the one Java-regex escape before javac.
tasks.withType(JavaCompile).configureEach {
    doFirst {
        def f = file('src/main/java/ro/filarmonica/transilvania/stagiune/FinalMainActivity.java')
        if (f.exists()) {
            def fixed = f.getText('UTF-8').replace('[:\\-–]', '[:–-]')
            f.write(fixed, 'UTF-8')
        }
    }
}
