        // Programul lucrărilor: same width as main card and slightly larger throughout.
        method('    private void renderWorksSection(LinearLayout parent, JSONObject e) {',
               '    private String cleanDistribution(String x) {',
'''    private void renderWorksSection(LinearLayout parent, JSONObject e) {
        JSONArray works=e.optJSONArray("works");
        if(works==null||works.length()==0) return;
        LinearLayout box=vertical();
        box.setBackground(strokeBg(Color.WHITE,14,1,Color.rgb(231,228,220)));
        pad(box,12,10,12,9);
        TextView head=tv("Programul lucrărilor",16.0f,GOLD,true);
        head.setTypeface(Typeface.create(Typeface.SERIF,Typeface.BOLD));
        box.addView(head);
        for(int i=0;i<works.length();i++) {
            JSONObject w=works.optJSONObject(i);
            if(w==null) continue;
            TextView title=tv(workLine(w),13.3f,NAVY,true);
            pad(title,0,8,0,2);
            box.addView(title);
            JSONArray orch=w.optJSONArray("orchestrations");
            if(orch!=null) {
                for(int j=0;j<orch.length();j++) {
                    JSONObject xx=orch.optJSONObject(j);
                    String lab=s(xx,"label"),disp=s(xx,"display");
                    if(!lab.isEmpty()) box.addView(tv(lab,11.6f,MUTED,true));
                    if(!disp.isEmpty()) box.addView(tv(disp,11.8f,MUTED,false));
                }
            }
            JSONArray det=w.optJSONArray("details");
            if(det!=null) for(int j=0;j<det.length();j++) {
                String xx=det.optString(j,"");
                if(!xx.isEmpty()&&!"null".equalsIgnoreCase(xx)) box.addView(tv(xx,11.8f,MUTED,false));
            }
            JSONObject sd=w.optJSONObject("string_distribution");
            String dist=cleanDistribution(s(sd,"display"));
            if(!dist.isEmpty()) box.addView(tv(dist,11.8f,MUTED,false));
            if(i<works.length()-1) box.addView(rule());
        }
        JSONArray global=e.optJSONArray("string_distributions");
        if(global!=null) for(int i=0;i<global.length();i++) {
            JSONObject xx=global.optJSONObject(i);
            if(xx==null||!s(xx,"applies_to").isEmpty()) continue;
            String d=cleanDistribution(s(xx,"display"));
            if(!d.isEmpty()) box.addView(tv(d,11.8f,MUTED,false));
        }
        parent.addView(box,new LinearLayout.LayoutParams(-1,-2));
    }

''', 'works section')

        // Repetiții: same width as works, larger day/time/description, one rehearsal block per line.
        method('    private void renderScheduleSection(LinearLayout parent, JSONObject e) {',
               '    private String join(List<String> xs,String sep) {',
'''    private void renderScheduleSection(LinearLayout parent, JSONObject e) {
        JSONArray reps=e.optJSONArray("rehearsals");
        if(reps==null||reps.length()==0) return;
        LinearLayout box=vertical();
        box.setBackground(strokeBg(Color.WHITE,14,1,Color.rgb(231,228,220)));
        pad(box,12,10,12,8);
        TextView head=tv("Repetiții:",16.0f,GOLD,true);
        head.setTypeface(Typeface.create(Typeface.SERIF,Typeface.BOLD));
        box.addView(head);

        for(int i=0;i<reps.length();i++) {
            JSONObject r=reps.optJSONObject(i);
            if(r==null) continue;
            String day=s(r,"day"),ann=s(r,"annotation");
            if(!ann.isEmpty()) day += (day.isEmpty()?"":" ")+ann;
            List<String[]> rows=scheduleRows(r);
            if(day.isEmpty()&&rows.isEmpty()) continue;

            LinearLayout dayRow=horizontal();
            dayRow.setGravity(Gravity.TOP);
            pad(dayRow,0,6,0,6);
            dayRow.addView(tv(day,14.8f,NAVY,true),new LinearLayout.LayoutParams(dp(48),-2));

            LinearLayout times=vertical();
            for(String[] item:rows) {
                LinearLayout one=horizontal();
                one.setGravity(Gravity.TOP);
                TextView time=tv(item[0],14.6f,NAVY,false);
                one.addView(time,new LinearLayout.LayoutParams(dp(92),-2));
                TextView desc=tv(item[1],14.6f,NAVY,false);
                one.addView(desc,new LinearLayout.LayoutParams(0,-2,1));
                times.addView(one);
            }
            dayRow.addView(times,new LinearLayout.LayoutParams(0,-2,1));
            box.addView(dayRow);
            if(i<reps.length()-1) box.addView(rule());
        }

        LinearLayout.LayoutParams repsLp=new LinearLayout.LayoutParams(-1,-2);
        repsLp.setMargins(0,dp(7),0,0);
        parent.addView(box,repsLp);

        TextView original=tv("Arată original",7.8f,Color.rgb(144,121,82),false);
        original.setGravity(Gravity.END);
        pad(original,0,4,7,0);
        original.setAlpha(.34f);
        original.setOnClickListener(v->showOriginal(e));
        parent.addView(original,new LinearLayout.LayoutParams(-1,-2));
    }

    private List<String[]> scheduleRows(JSONObject r) {
        List<String[]> out=new ArrayList<>();
        JSONArray lines=r.optJSONArray("lines");
        String pending="";
        if(lines!=null) {
            for(int j=0;j<lines.length();j++) {
                JSONObject l=lines.optJSONObject(j);
                String display=normalizeConcertLabel(s(l,"display"));
                if(display.isEmpty()) continue;
                String[] parts=display.split("\\\\s*\\\\|\\\\s*");
                for(String raw:parts) {
                    String part=raw.trim();
                    if(part.isEmpty()) continue;
                    String low=norm(part);
                    if(low.startsWith("concert ")) {
                        String t=part.substring(part.indexOf(' ')+1).trim();
                        out.add(new String[]{t,"Concert"});
                        continue;
                    }
                    if(startsWithTime(part)) {
                        int sp=part.indexOf(' ');
                        String time=sp>0?part.substring(0,sp).trim():part;
                        String desc=sp>0?part.substring(sp+1).trim():"";
                        if(!pending.isEmpty()) {
                            desc=pending+(desc.isEmpty()?"":"  "+desc);
                            pending="";
                        }
                        if(norm(desc).equals("concert")) desc="Concert";
                        out.add(new String[]{time,desc});
                    } else if(low.equals("liber")||low.equals("anulat")||low.startsWith("anulat ")) {
                        out.add(new String[]{"",part});
                    } else {
                        pending=part;
                    }
                }
            }
        }
        if(!pending.isEmpty()) out.add(new String[]{"",pending});
        return out;
    }

    private boolean startsWithTime(String x) {
        if(x==null||x.length()<4||!Character.isDigit(x.charAt(0))) return false;
        return x.contains(":")&&(x.contains("–")||x.contains("-"));
    }

    private String normalizeConcertLabel(String x) {
        if(x==null) return "";
        return x.replaceAll("(?iu)\\\\bconcert\\\\b","Concert");
    }

    private void showOriginal(JSONObject e) {
        JSONObject raw=e==null?null:e.optJSONObject("raw");
        String text="";
        if(raw!=null) {
            String p=s(raw,"program");
            if(!p.isEmpty()) text=p;
            else text=raw.toString();
        }
        if(text==null||text.trim().isEmpty()) text="Nu există text original pentru acest concert.";
        TextView body=tv(text,14.0f,NAVY,false);
        body.setTextIsSelectable(true);
        pad(body,14,10,14,10);
        ScrollView sc=new ScrollView(this);
        sc.addView(body,new ScrollView.LayoutParams(-1,-2));
        new AlertDialog.Builder(this).setTitle("Original").setView(sc).setPositiveButton("Închide",null).show();
    }

