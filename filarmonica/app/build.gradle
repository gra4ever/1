plugins {
    id 'com.android.application'
}

android {
    namespace 'ro.filarmonica.transilvania.stagiune'
    compileSdk 35

    defaultConfig {
        applicationId 'ro.filarmonica.transilvania.stagiune'
        minSdk 24
        targetSdk 35
        versionCode 15
        versionName '0.15.0'
    }

    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// v0.15 — deterministic UI transform. Every required change is asserted before compilation.
tasks.withType(JavaCompile).configureEach {
    doFirst {
        def f = file('src/main/java/ro/filarmonica/transilvania/stagiune/FinalMainActivity.java')
        if (!f.exists()) throw new GradleException('FinalMainActivity.java missing')
        def x = f.getText('UTF-8')

        def req = { String oldText, String newText, String label ->
            if (!x.contains(oldText)) throw new GradleException("v0.15 patch missing: ${label}")
            x = x.replace(oldText, newText)
        }
        def method = { String startSig, String endSig, String replacement, String label ->
            int a = x.indexOf(startSig)
            int b = x.indexOf(endSig, a)
            if (a < 0 || b <= a) throw new GradleException("v0.15 method patch missing: ${label}")
            x = x.substring(0, a) + replacement + x.substring(b)
        }

        req('import android.app.Activity;\n', 'import android.app.Activity;\nimport android.app.AlertDialog;\n', 'AlertDialog import')

        // Bottom bar: Romanian labels, larger controls.
        req('addNav("⌕\\nSearch", "Search".equals(selected), this::showSearch);',
            'addNav("⌕\\nCaută", "Search".equals(selected), this::showSearch);', 'Caută nav label')
        req('root.addView(bottom, new LinearLayout.LayoutParams(-1, dp(62)));',
            'root.addView(bottom, new LinearLayout.LayoutParams(-1, dp(76)));', 'bottom bar height')
        req('TextView b = tv(label, 11.5f, selected ? BLUE : MUTED, selected);',
            'TextView b = tv(label, 13.5f, selected ? BLUE : MUTED, selected);', 'bottom bar font')
        req('shell("Search"); addSimplePageTitle("Search");',
            'shell("Search"); addSimplePageTitle("Caută");', 'Caută page title')

